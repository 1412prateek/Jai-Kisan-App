plugins {
    alias(libs.plugins.android.application)
}

// ✅ This block reads your local.properties file
Properties properties = new Properties()
if (project.rootProject.file("local.properties").exists()) {
    properties.load(project.rootProject.file("local.properties").newDataInputStream())
}

android {
    namespace 'com.rcc.jai_kisan'
    compileSdk 36

    // ✅ ADDED: This line fixes the error by re-enabling BuildConfig
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.rcc.jai_kisan"
        minSdk 24
        targetSdk 36
        versionCode 14
        versionName "1.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ✅ This line creates the secure variable for your Java code
        buildConfigField "String", "GEMINI_API_KEY", "\"${properties.getProperty("GEMINI_API_KEY")}\""
        buildConfigField "String", "GEMINI_KEY_1", "\"${properties.getProperty("GEMINI_KEY_1")}\""
        buildConfigField "String", "GEMINI_KEY_2", "\"${properties.getProperty("GEMINI_KEY_2")}\""
        buildConfigField "String", "GEMINI_KEY_3", "\"${properties.getProperty("GEMINI_KEY_3")}\""
        buildConfigField "String", "GEMINI_KEY_4", "\"${properties.getProperty("GEMINI_KEY_4")}\""
        buildConfigField "String", "GEMINI_KEY_5", "\"${properties.getProperty("GEMINI_KEY_5")}\""
        buildConfigField "String", "GEMINI_KEY_6", "\"${properties.getProperty("GEMINI_KEY_6")}\""
        buildConfigField "String", "GEMINI_KEY_7", "\"${properties.getProperty("GEMINI_KEY_7")}\""
        buildConfigField "String", "GEMINI_KEY_8", "\"${properties.getProperty("GEMINI_KEY_8")}\""
        buildConfigField "String", "GEMINI_KEY_9", "\"${properties.getProperty("GEMINI_KEY_9")}\""
        buildConfigField "String", "GEMINI_KEY_10", "\"${properties.getProperty("GEMINI_KEY_10")}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // ... (All your other dependencies)
    // (No changes needed here)
    implementation libs.appcompat
    implementation 'com.google.android.material:material:1.14.0-alpha08'
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.play.services.location
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "io.noties.markwon:core:4.6.2"

    // Room Database libraries
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // ✅ VVI IMPROVEMENT: Added Lifecycle library for LiveData and ViewModel
    def lifecycle_version = "2.6.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20230227'

    // Google Play In-App Updates
    implementation 'com.google.android.play:app-update:2.1.0'

}